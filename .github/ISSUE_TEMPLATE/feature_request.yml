name: Feature request
description: Suggest something AI Manager should track or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to know or do?
      description: The question you want answered about your agents, or the thing that's missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it?
  - type: dropdown
    id: agent
    attributes:
      label: Which agent is this about?
      options: [Claude Code, Codex, Both, Something else]
