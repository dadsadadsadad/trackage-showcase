name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please don't paste prompts, code or log contents you'd rather keep private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trackage CLI version
      description: Run `trackage --version`, or leave blank if this is about the website.
      placeholder: "0.4.0"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Only the website]
    validations:
      required: true
  - type: checkboxes
    id: agents
    attributes:
      label: Which agents do you use?
      options:
        - label: Claude Code
        - label: Codex
        - label: Gemini CLI
        - label: Qwen Code
        - label: OpenCode
        - label: ChatGPT import
        - label: Usage API
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
