name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please don't paste prompts, code or log contents you'd rather keep private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Manager version
      description: Settings → Shortcuts & about.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux]
    validations:
      required: true
  - type: checkboxes
    id: agents
    attributes:
      label: Which agents do you use?
      options:
        - label: Claude Code
        - label: Codex
        - label: ChatGPT import
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
